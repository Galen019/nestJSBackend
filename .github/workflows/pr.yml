name: PR

on:
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run test:e2e

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  integration:
    runs-on: ubuntu-latest
    needs: [unit-test, linter]
    timeout-minutes: 15
    env:
      REDIS_PASSWORD: change-me-test
      JWT_ISSUER: test-issuer
      JWT_AUDIENCE: test-audience
      PORT: 3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for app health
        run: |
          for _ in $(seq 1 30); do
            curl --fail "http://localhost:${PORT:-3000}/health" && exit 0
            sleep 2
          done
          echo "App did not become healthy in time"
          exit 1
      - name: Redis REST probe
        run: npx ts-node --transpile-only scripts/test-redis.ts probe-2 hello
        env:
          API_URL: http://localhost:${{ env.PORT }}
          TEST_PRIVATE_KEY_PATH: ${{ github.workspace }}/test/fixtures/test-private.pem
      - name: Dump stack logs
        if: failure()
        run: docker compose logs app redis
      - name: Tear down stack
        if: always()
        run: docker compose down -v
