# Lab entrypoint synced by Argo CD; exclude its management Application.
# Add observability resources in observability/kustomization.yaml.
# Apply with: kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-route.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - dynamodb-deployment.yaml
  - dynamodb-service.yaml
  - observability/
  - argocd-route.yaml
  - envoy/gateway.yaml
  - envoy/envoy-proxy.yaml
