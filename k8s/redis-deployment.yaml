# Runs Redis (mirrors compose `redis: redis:7-alpine`).
# Ephemeral, no PVC (compose parity). Password comes from app-secrets;
# $(REDIS_PASSWORD) uses Kubernetes variable expansion. No k8s probes —
# compose healthcheck (redis-cli ping) is intentionally not mirrored.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ['redis-server', '--requirepass', '$(REDIS_PASSWORD)']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
