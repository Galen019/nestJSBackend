# Grafana lab admin credentials (mirrors compose GF_SECURITY_ADMIN_USER and
# GF_SECURITY_ADMIN_PASSWORD, which default to admin/admin).
# Filed values are lab placeholders only. Live data is managed out of band:
# the ArgoCD Application ignores /data drift on this Secret, so a manual
# kubectl edit survives sync/selfHeal. For prod prefer external-secrets or
# sealed-secrets over committing values.
# Lab rotation: kubectl -n backend-lab create secret generic grafana-secrets \
#   --from-literal=admin-user=<real-user> \
#   --from-literal=admin-password=<real-password> \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
