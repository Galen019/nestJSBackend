# Grafana lab credentials; defaults match Compose.
# Placeholders only; Argo CD ignores /data drift for rotation.
# Use external-secrets or sealed-secrets in production.
# Rotate: kubectl -n backend-lab create secret generic grafana-secrets \
#   --from-literal=admin-user=<real-user> \
#   --from-literal=admin-password=<real-password> \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
