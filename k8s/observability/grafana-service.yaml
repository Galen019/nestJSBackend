# Grafana DNS and UI: grafana:3000.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
