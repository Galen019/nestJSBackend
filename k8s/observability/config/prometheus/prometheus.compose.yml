# Docker Compose scrape targets.
#
# Kubernetes discovery is not available outside a cluster, so Compose keeps a
# single static target and mounts this file instead.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:9464']
