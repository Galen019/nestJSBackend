# Grafana state, mounted at /var/lib/grafana.
# Increase 1Gi if plugins or retention need more space.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
