# Jaeger OTLP/gRPC: 4317; UI: 16686; health: 13133.
# OTLP/HTTP 4318 is not configured.
# UI: kubectl -n backend-lab port-forward svc/jaeger 16686:16686
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3