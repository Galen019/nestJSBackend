# Observability manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - jaeger-deployment.yaml
  - jaeger-service.yaml
  - observability-routes.yaml
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - grafana-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-secrets.yaml

# Shared config; hashes roll pods on edits.
generatorOptions:
  labels:
    app.kubernetes.io/part-of: productionBackend
configMapGenerator:
  - name: prometheus-config
    namespace: backend-lab
    files:
      - prometheus.yml=config/prometheus/prometheus.yml
  - name: grafana-datasources
    namespace: backend-lab
    files:
      - prometheus.yml=config/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provisioning
    namespace: backend-lab
    files:
      - dashboards.yaml=config/grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards
    namespace: backend-lab
    files:
      # Grafana.com dashboard 12230 (Node.js Dashboard), revision 4.
      - nodejs.json=config/grafana/dashboards/nodejs.json
