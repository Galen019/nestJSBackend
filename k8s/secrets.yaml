# Lab Redis/JWT secrets; the JWT key mirrors the Compose mount.
# Test fixtures only; Argo CD ignores /data drift for lab rotation.
# Use external-secrets or sealed-secrets in production.
# Rotate in the lab:
# kubectl create secret generic app-secrets -n backend-lab \
#   --from-literal=REDIS_PASSWORD=<real> \
#   --from-file=jwt-public.pem=<prod-key.pem> \
#   --dry-run=client -o yaml | kubectl apply -f -
