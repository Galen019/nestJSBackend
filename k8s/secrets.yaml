# Lab secrets: Redis password + JWT public key (mirrors compose mount
# ./test/fixtures/test-public.pem -> /run/secrets/jwt-public.pem).
# Filed bytes are the committed TEST fixture only. For prod overwrite with:
# kubectl create secret generic app-secrets -n backend-lab \
#   --from-literal=REDIS_PASSWORD=<real> \
#   --from-file=jwt-public.pem=<prod-key.pem> \
#   --dry-run=client -o yaml | kubectl apply -f -
# REDIS_PASSWORD is required (no empty-password mode in k8s); lab placeholder is dev.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
