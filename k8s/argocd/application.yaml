apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Galen019/nestJSBackend.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: backend-lab

  # Ignore lab Secret data drift so manual rotations persist.
  # Use external-secrets or sealed-secrets in production.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: app-secrets
      namespace: backend-lab
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: grafana-secrets
      namespace: backend-lab
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
