apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Galen019/nestJSBackend.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: backend-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true