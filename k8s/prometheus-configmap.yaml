# Prometheus scrape config (mirrors prometheus/prometheus.yml for compose parity).
# Compose bind-mounts ./prometheus/prometheus.yml; k8s mounts this ConfigMap
# at /etc/prometheus/prometheus.yml. Keep both in sync; compose file is source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: backend-lab
  labels:
    app.kubernetes.io/part-of: productionBackend
data:
  prometheus.yml: |
    # Prometheus scrape config for the compose lab.
    #
    # - app: request counts and latencies from the NestJS scrape server on :9464
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: 'app'
        metrics_path: /metrics
        static_configs:
          - targets: ['app:9464']
