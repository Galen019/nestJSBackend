# Prometheus scrape config (OTLP push receiver needs no YAML block in v3).\n# OTLP/HTTP metrics are enabled via the compose command flag\n# `--web.enable-otlp-receiver` and arrive at\n# `/api/v1/otlp/v1/metrics`. Only self-scrape is configured here.\nglobal:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n\nscrape_configs:\n  - job_name: prometheus\n    static_configs:\n      - targets: ['localhost:9090']\n