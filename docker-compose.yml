services:
  app:
    build: .
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
      - '127.0.0.1:${GRPC_PORT:-50051}:${GRPC_PORT:-50051}'
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${TEST_PUBLIC_KEY_PATH:-./test/fixtures/test-public.pem}:/run/secrets/jwt-public.pem:ro
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - GRPC_URL=0.0.0.0:${GRPC_PORT:-50051}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt-public.pem
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nestJS-server}
      # OTLP/gRPC traces endpoint. Must stay in sync with DEFAULT_OTLP_ENDPOINT
      # in src/tracing.ts. The server uses the gRPC exporter, which Jaeger
      # serves on 4317; 4318 is OTLP/HTTP and needs the HTTP exporter instead.
      # OTEL_TRACES_SAMPLER is read natively by the SDK (no app mapping).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
