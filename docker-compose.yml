services:
  app:
    build: .
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_started
    volumes:
      - ${TEST_PUBLIC_KEY_PATH:-./test/fixtures/test-public.pem}:/run/secrets/jwt-public.pem:ro
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt-public.pem
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nestJS-server}
      # OTLP/gRPC traces endpoint. Must stay in sync with DEFAULT_OTLP_ENDPOINT
      # in src/tracing.ts. The server uses the gRPC exporter, which Jaeger
      # serves on 4317; 4318 is OTLP/HTTP and needs the HTTP exporter instead.
      # OTEL_TRACES_SAMPLER is read natively by the SDK (no app mapping).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      # OTLP/HTTP metrics endpoint. Must stay in sync with DEFAULT_OTLP_METRICS_ENDPOINT
      # in src/tracing.ts. The server uses the proto HTTP exporter, which Prometheus
      # serves at /api/v1/otlp/v1/metrics; OTEL_EXPORTER_OTLP_METRICS_PROTOCOL is
      # operator documentation (the exporter is hardcoded to http/protobuf).
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=${OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-http/protobuf}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-otlp-receiver'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    ports:
      - '127.0.0.1:${DYNAMODB_PORT:-8000}:8000'
    restart: unless-stopped

volumes:
  prometheus-data:
